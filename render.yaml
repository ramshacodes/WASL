services:
  - type: web
    name: wasl-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DEMO_MODE
        value: "true"
      - key: ALLOWED_ORIGINS
        value: "http://localhost:3000"
      - key: CAMARA_BASE_URL
        value: ""
      - key: CAMARA_API_KEY
        value: ""
      - key: GEMINI_API_KEY
        value: ""
    healthCheckPath: /api/health
